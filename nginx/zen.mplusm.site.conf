server {
    listen 80;
    server_name zen.mplusm.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zen.mplusm.site;

    ssl_certificate /etc/letsencrypt/live/zen.mplusm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zen.mplusm.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /www/wwwlogs/zen.access.log;
    error_log /www/wwwlogs/zen.error.log;

    root /www/wwwroot/zen.mplusm.site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
