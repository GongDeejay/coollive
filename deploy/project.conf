# ZenTalk 项目部署配置
PROJECT_NAME="zentalk"
DOMAIN="zen.mplusm.site"
ADMIN_EMAIL="admin@mplusm.site"

SERVER_IP="43.133.145.77"
SERVER_USER="root"

FRONTEND_TYPE="static"
FRONTEND_BUILD_DIR="frontend/dist"
FRONTEND_BUILD_CMD="cd frontend && npm ci --silent && npm run build"

BACKEND_TYPE="python"
BACKEND_PORT="8765"
BACKEND_DIR="backend"
BACKEND_START_CMD="python3 -m uvicorn backend.main:app --host 127.0.0.1 --port 8765"
BACKEND_INSTALL_CMD="pip3 install -r backend/requirements.txt -q"

ENV_VARS="XIAOMI_API_KEY=${XIAOMI_API_KEY}
XIAOMI_BASE_URL=${XIAOMI_BASE_URL}
XIAOMI_MODEL=${XIAOMI_MODEL}
XIAOMI_TIMEOUT=${XIAOMI_TIMEOUT}"

API_PREFIX="/api"
